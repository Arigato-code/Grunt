# Release Drafter configuration
# https://github.com/release-drafter/release-drafter

name-template: "v$RESOLVED_VERSION 🌈"
tag-template: "v$RESOLVED_VERSION"
categories:
  - title: "🚀 Features"
    labels:
      - "feature"
      - "enhancement"
  - title: "🐛 Bug Fixes"
    collapse-after: 5
    labels:
      - "fix"
      - "bugfix"
      - "bug"
  - title: "🧰 Maintenance"
    collapse-after: 3
    label: "chore"
  - title: "⬆️  Dependencies"
    collapse-after: 3
    labels:
      - "dependencies"
change-template: "- $TITLE @$AUTHOR (#$NUMBER)"
change-title-escapes: '\<*_&'
version-template: "$MAJOR.$MINOR.$PATCH"
autolabeler:
  - label: "chore"
    files:
      - "*.md"
    title:
      - "/chore/i"
      - "/docs/i"
  - label: "bug"
    title:
      - "/fix/i"
      - "/bug/i"
      - "/patch/i"
  - label: "feature"
    title:
      - "/feat/i"
  - label: "enhancement"
    title:
      - "/enhancement/i"
      - "/perf/i"
  - label: "major"
    title:
      - "major"
      - "breaking"
      - "incompatible"
version-resolver:
  major:
    labels:
      - "major"
      - "breaking"
  minor:
    labels:
      - "minor"
      - "fix"
      - "bugfix"
      - "bug"
      - "enhancement"
      - "feature"
  patch:
    labels:
      - "patch"
      - "chore"
  default: patch
template: |
  ## What's Changed

  $CHANGES
